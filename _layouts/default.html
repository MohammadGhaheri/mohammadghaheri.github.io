<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" dir="{% if page.lang == 'fa' %}rtl{% else %}ltr{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header>
  <div class="wrap">
    <nav>
      <a class="brand" href="{{ '/' | relative_url }}">Mohammad Ghaheri</a>
      <div class="navlinks">
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/articles/' | relative_url }}">Articles</a>
        <a href="https://github.com/MohammadGhaheri" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </nav>
  </div>
</header>

<main>{{ content }}</main>

<footer>
  <div class="wrap footerline">
    <span>© {{ 'now' | date: '%Y' }} Mohammad Ghaheri</span>
    <span>Product · Mobility · Data</span>
  </div>
</footer>
</body>
</html>
