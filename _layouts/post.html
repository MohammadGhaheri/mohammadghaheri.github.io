---
layout: default
---
<div class="page">
  <div class="wrap article">
    <a class="back" href="{{ '/articles/' | relative_url }}">← All articles</a>
    <header class="article-header">
      <div class="meta">{{ page.date | date: "%B %-d, %Y" }}</div>
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
      {% if page.tags %}
      <div class="tags">
        {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
      </div>
      {% endif %}
    </header>
    <article class="article-body">{{ content }}</article>
  </div>
</div>
